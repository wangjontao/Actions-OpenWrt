name: MT7981 MTWiFi FastACL 2.6.0 Testing
run-name: 'FastACL 2.6.0 - BBR and unlimited connections - MT7981'
'on':
  workflow_dispatch: {}
  push:
    branches: ['codex/mt7981-fastacl260-hardware-mac']
    paths: ['.github/workflows/MT7981-FastACL260-MTWiFi.yml']

permissions:
  contents: read
concurrency:
  group: fastacl260-MT7981-FastACL260-MTWiFi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: MTWiFi, DNS and UI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: 1.26.0
        cache: false
    - name: Install validation tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y lua5.1 nftables iproute2 curl shfmt squashfs-tools
        python3 -m venv .venv
        .venv/bin/pip install lupa PyYAML playwright dissect.squashfs==1.12
        .venv/bin/playwright install --with-deps chromium
        curl -fL --retry 3 -o /tmp/dae-amd64.tar.xz \
          https://github.com/daeuniverse/dae/releases/download/v2.1.1/dae-linux-x86_64.tar.xz
        echo 'c550af580dc97cc90986260da78c4bf72917f3213c2b5d8b79c45199d9c3dc90  /tmp/dae-amd64.tar.xz' | sha256sum -c -
        mkdir /tmp/dae-core
        tar -xJf /tmp/dae-amd64.tar.xz -C /tmp/dae-core
        install -m755 "$(find /tmp/dae-core -type f -name dae | head -n1)" /tmp/dae
    - name: Validate Lite hot path and syntax
      run: |
        python3 profiles/fastacl-v252/tests/test_bbr.py
        .venv/bin/python profiles/fastacl-v252/tests/test_hardware_mac.py
        .venv/bin/python scripts/tests/test_mt7981_workflow_shell.py
        .venv/bin/python scripts/tests/test_firmware_artifacts_mt7981.py
        .venv/bin/python profiles/fastacl-v252/tests/test_wireless.py
        .venv/bin/python profiles/fastacl-v252/tests/test_wifi_fw4.py
        .venv/bin/python profiles/fastacl-v252/tests/test_fixed_exit.py
        python3 profiles/fastacl-v252/tests/test_lite_hotpath.py
        .venv/bin/python profiles/fastacl-v252/tests/test_control.py
        python3 profiles/fastacl-v252/tests/test_runtime.py
        find profiles/fastacl-v252/root -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
        find profiles/fastacl-v252/root -type f | while read -r file; do
          if head -n1 "$file" | grep -q '^#!/bin/sh'; then sh -n "$file"; shfmt -ln posix "$file" >/dev/null; fi
        done
        .venv/bin/python profiles/fastacl-v252/tests/test_import.py
        .venv/bin/python profiles/fastacl-v252/tests/test_split_data.py
        .venv/bin/python profiles/fastacl-v252/tests/test_subscription.py
        .venv/bin/python profiles/fastacl-v252/tests/test_menu_cleanup.py
        .venv/bin/python profiles/fastacl-v252/tests/test_reboot.py
        .venv/bin/python profiles/fastacl-v252/tests/test_login_theme.py
    - name: Validate DNS relay and native nodes
      run: |
        (cd profiles/fastacl-v252/dns && go mod tidy && go mod vendor && python3 ../patch_outbound.py . && go test -mod=vendor -race -timeout 2m ./... && go build -mod=vendor -trimpath -o /tmp/fastacl252-dns .)
        .venv/bin/python profiles/fastacl-v252/tests/test_mihomo.py --core /tmp/dae --helper /tmp/fastacl252-dns
        for config in profiles/fastacl-v252/test-results/import-*.dae; do /tmp/dae validate -c "$config"; done
    - name: Validate quick-switch console in Chromium
      run: |
        cd profiles/fastacl-v252/tests
        ../../../.venv/bin/python test_browser.py
    - name: Validate MTWiFi adapter and vendor ABI
      run: |
        .venv/bin/python profiles/fastacl-v252/tests/test_mtwifi.py
        go test ./profiles/fastacl-v252/mtwifi/mtwifi-station-bytes.go ./profiles/fastacl-v252/mtwifi/mtwifi-station-bytes_test.go
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/mtwifi-station-bytes ./profiles/fastacl-v252/mtwifi/mtwifi-station-bytes.go
        readelf -h /tmp/mtwifi-station-bytes | grep -q AArch64
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: FastACL255-preflight-evidence
        path: profiles/fastacl-v252/test-results/*
        if-no-files-found: warn
        retention-days: 14
  build:
    name: MT7981 ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - group: hy-rax-360
          devices: philips_hy3000 cmcc_rax3000m-nand-mtk cmcc_rax3000m-emmc-mtk qihoo_360t7 aigo_ags21
        - group: a10-newland
          devices: cmcc_a10-ubootmod konka_komi-a31 newland_nl-wr8103 newland_nl-wr9103 abt_asr3000
        - group: q30-ax3000t
          devices: jcg_q30-pro xiaomi_mi-router-ax3000t xiaomi_mi-router-ax3000t-mtkuboot xiaomi_mi-router-ax3000t-ubootmod
        - group: wr30u-z8103
          devices: xiaomi_mi-router-wr30u-stock xiaomi_mi-router-wr30u-ubootmod nokia_ea0326gmp sl_3000-emmc zbtlink_zbt-z8103ax-c
    env:
      MT7981_DEVICES: ${{ matrix.devices }}
      DEVICE_GROUP: ${{ matrix.group }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Initialize build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm nano ninja-build p7zip-full patch pkgconf python3 python3-pip python3-venv python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone Asia/Shanghai
        echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
        echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        mkdir -p .ccache
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

        python3 -m venv "$GITHUB_WORKSPACE/.firmware-venv"
        "$GITHUB_WORKSPACE/.firmware-venv/bin/pip" install dissect.squashfs==1.12
    - name: Clone pinned MTWiFi 6.6 source
      run: |
        git clone --depth=1 --branch openwrt-24.10-6.6 https://github.com/padavanonly/immortalwrt-mt798x-24.10.git openwrt
        git -C openwrt fetch --depth=1 origin ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
        git -C openwrt checkout --detach ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
    - uses: actions/setup-go@v5
      with:
        go-version: 1.26.0
        cache: false
    - name: Restore source and compiler cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          .ccache
        key: mt7981-fastacl260-fixed-${{ matrix.group }}-${{ hashFiles('profiles/fastacl-v252/*Makefile', 'profiles/fastacl-v252/mt7981-common.config')
          }}
        restore-keys: mt7981-fastacl260-fixed-${{ matrix.group }}-
    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds install -f -p packages nps npc
        ./scripts/feeds install -f -p luci luci-app-nps luci-i18n-nps-zh-cn luci-app-autoreboot
      working-directory: openwrt
    - name: Pin original ehang NPS client 0.26.10 and enable domain server
      working-directory: openwrt
      run: |
        NPS_MAKEFILE=feeds/packages/net/nps/Makefile
        sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=0.26.10/' "$NPS_MAKEFILE"
        sed -i 's#^PKG_SOURCE_URL:=.*#PKG_SOURCE_URL:=https://codeload.github.com/ehang-io/nps/tar.gz/v$(PKG_VERSION)?#' "$NPS_MAKEFILE"
        sed -i 's/^PKG_HASH:=.*/PKG_HASH:=1b2fe9d251f55105d65027a1cee464f65d2f6ab3bd4a20e4655e5135db68aee7/' "$NPS_MAKEFILE"
        grep -q '^PKG_VERSION:=0.26.10$' "$NPS_MAKEFILE"
        grep -q 'github.com/ehang-io/nps' "$NPS_MAKEFILE"
        for nps_lua in feeds/luci/applications/luci-app-nps/luasrc/model/cbi/nps.lua package/feeds/luci/luci-app-nps/luasrc/model/cbi/nps.lua; do
          [ -f "$nps_lua" ] || continue
          sed -i -E 's/server\.datatype[[:space:]]*=[[:space:]]*"ipaddr"/server.datatype="host"/' "$nps_lua"
          sed -i 's/Must an IPv4 address/IPv4 address or domain name/' "$nps_lua"
        done
        grep -q 'server.datatype="host"' feeds/luci/applications/luci-app-nps/luasrc/model/cbi/nps.lua
        echo 'Pinned original ehang-io NPC 0.26.10 for server compatibility.'
    - name: Add Argon and NPS defaults
      run: |
        rm -rf package/luci-theme-argon package/luci-app-argon-config
        git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
        git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
        NPS_CONFIG_FILE="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f 2>/dev/null | head -n1)"
        if [ -n "$NPS_CONFIG_FILE" ]; then
          cat > "$NPS_CONFIG_FILE" <<'NPS_CONFIG'
        config nps
          option enabled '1'
          option server_addr 'nps.jontao.top'
          option server_port '8024'
          option protocol 'tcp'
          option compress '1'
          option crypt '1'
          option vkey 'WANMAC'
          option log_level '4'
        NPS_CONFIG
        fi
      working-directory: openwrt
    - name: Integrate FastACL Lite
      run: |
        sh "$GITHUB_WORKSPACE/scripts/integrate-fastacl255-mt7981.sh"
        grep -q "PKG_VERSION:=2.6.0" package/fastacl252/Makefile
      working-directory: openwrt
    - name: Download sources
      run: |
        make download -j"$(nproc)"
        find dl -type f -size -1024c -print -delete
      working-directory: openwrt
    - name: Compile device firmware
      run: |
        rm -rf dl/go-mod-cache
        mkdir -p dl/go-mod-cache
        make tools/install -j"$(nproc)" || make tools/install -j1 V=s
        make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
        make target/linux/compile -j"$(nproc)" V=s
        kernel=$(find build_dir/target-* -path '*/linux-mediatek_filogic/linux-6.6*/.config' | head -n1)
        test -n "$kernel"
        sh profiles/fastacl-v252/check-kernel.sh "$kernel"
        # Compile packages in parallel; serialize final rootfs/FIT packaging.
        # Per-device mkits jobs share ROOTFS.pagesync and can truncate it.
        # Standalone package/compile bypasses world/prepare build metadata.
        make buildinfo
        for metadata in config feeds version; do
          test -s "bin/targets/mediatek/filogic/${metadata}.buildinfo"
        done
        make package/compile -j"$(nproc)" || make package/compile -j1 V=s
        make -j1 V=s
        kernel=$(find build_dir/target-* -path '*/linux-mediatek_filogic/linux-6.6*/.config' | head -n1)
        test -n "$kernel"
        sh profiles/fastacl-v252/check-kernel.sh "$kernel"
      working-directory: openwrt
    - name: Collect all generated firmware before verification
      if: always()
      working-directory: openwrt
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/firmware-artifacts-mt7981.py" collect
    - name: Preserve all firmware artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MT7981-FastACL260-all-output-${{ matrix.group }}-${{ github.run_id }}
        path: openwrt/upload/*
        if-no-files-found: warn
        retention-days: 30
    - name: Verify each firmware image and package manifest
      working-directory: openwrt
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/.firmware-venv/bin/python" "$GITHUB_WORKSPACE/scripts/firmware-artifacts-mt7981.py" verify
    - name: Upload validated firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: MT7981-FastACL2.6.0-MTWiFi-${{ matrix.group }}-${{ env.BUILD_DATE }}
        path: openwrt/upload/*
        if-no-files-found: error
        retention-days: 30
    - name: Upload build failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: MT7981-FastACL255-failure-${{ matrix.group }}-${{ github.run_id }}
        path: |
          openwrt/logs/
          openwrt/.config
          openwrt/MT7981-FastACL255-final.config
          openwrt/upload/verification.json
        if-no-files-found: ignore
        retention-days: 14
