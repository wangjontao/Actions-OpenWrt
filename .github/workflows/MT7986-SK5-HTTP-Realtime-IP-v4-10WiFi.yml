name: MT7986 S20L AX6000 V5 OpenWiFi SingleWiFi Stable mt76

on:
  workflow_dispatch:
  push:
    branches:
      - jontaoNpS-mt7986-s20l-ax6000-v5-openwifi-singlewifi

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-24.10.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Actions-OpenWrt
        uses: actions/checkout@v4

      - name: Free disk and install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq \
            openssl ccache zstd
          sudo apt-get clean
          df -h /

      - name: Clone ImmortalWrt 24.10 stable open-source WiFi source
        run: |
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "SOURCE_HASH=$(git -C openwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"


      - name: Verify stable open-source MT7986 WiFi
        working-directory: openwrt
        run: |
          common=$(sed -n '/^define Device\/supergateway_s20-common$/,/^endef$/p' target/linux/mediatek/image/filogic.mk)
          for pkg in kmod-mt7915e kmod-mt7986-firmware mt7986-wo-firmware; do
            grep -q "$pkg" <<<"$common" || exit 1
          done
          echo 'Using source-native mt76/mt7915e wireless.'


      - name: Update feeds and add iStore
        working-directory: openwrt
        run: |
          grep -q '^src-git istore ' feeds.conf.default || echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default
          grep -q '^src-git nas_packages ' feeds.conf.default || echo 'src-git nas_packages https://github.com/linkease/nas-packages.git;master' >> feeds.conf.default
          grep -q '^src-git nas_luci ' feeds.conf.default || echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store
          ./scripts/feeds install -d y -p nas_packages quickstart
          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart

      - name: Pin original ehang NPS client 0.26.10 and enable domain server
        working-directory: openwrt
        run: |
          NPS_MAKEFILE=feeds/packages/net/nps/Makefile
          sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=0.26.10/' "$NPS_MAKEFILE"
          sed -i 's#^PKG_SOURCE_URL:=.*#PKG_SOURCE_URL:=https://codeload.github.com/ehang-io/nps/tar.gz/v$(PKG_VERSION)?#' "$NPS_MAKEFILE"
          sed -i 's/^PKG_HASH:=.*/PKG_HASH:=1b2fe9d251f55105d65027a1cee464f65d2f6ab3bd4a20e4655e5135db68aee7/' "$NPS_MAKEFILE"
          grep -q '^PKG_VERSION:=0.26.10$' "$NPS_MAKEFILE"
          grep -q 'github.com/ehang-io/nps' "$NPS_MAKEFILE"
          for nps_lua in feeds/luci/applications/luci-app-nps/luasrc/model/cbi/nps.lua package/feeds/luci/luci-app-nps/luasrc/model/cbi/nps.lua; do
            [ -f "$nps_lua" ] || continue
            sed -i -E 's/server\.datatype[[:space:]]*=[[:space:]]*"ipaddr"/server.datatype="host"/' "$nps_lua"
            sed -i 's/Must an IPv4 address/IPv4 address or domain name/' "$nps_lua"
          done
          grep -q 'server.datatype="host"' feeds/luci/applications/luci-app-nps/luasrc/model/cbi/nps.lua
          echo 'Pinned original ehang-io NPC 0.26.10 for server compatibility.'

      - name: Pin Passwall 26.3.6-1 and add Passwall2 26.3.5-1
        working-directory: openwrt
        run: |
          rm -rf feeds/luci/applications/luci-app-passwall package/feeds/luci/luci-app-passwall
          rm -rf package/passwall-luci package/passwall2-luci
          git clone --depth=1 --single-branch --branch 26.3.6-1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
          git clone --depth=1 --single-branch --branch 26.3.5-1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2-luci
          test "$(git -C package/passwall-luci describe --tags --exact-match)" = "26.3.6-1"
          test "$(git -C package/passwall2-luci describe --tags --exact-match)" = "26.3.5-1"

      - name: Patch PassWall and PassWall2 SK5 HTTP import
        working-directory: openwrt
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patch-passwall-sk5-http.py"
          grep -q 'JuLiangTK: allow multiline SOCKS5 shorthand' package/passwall-luci/luci-app-passwall/luasrc/view/passwall/node_list/link_add_node.htm
          grep -q 'JuLiangTK: allow multiline SOCKS5 shorthand' package/passwall2-luci/luci-app-passwall2/luasrc/view/passwall2/node_list/link_add_node.htm
          grep -q 'JuLiangTK: import SOCKS5/SOCKS/HTTP provider links' package/passwall-luci/luci-app-passwall/root/usr/share/passwall/subscribe.lua
          grep -q 'JuLiangTK: import SOCKS5/SOCKS/HTTP provider links' package/passwall2-luci/luci-app-passwall2/root/usr/share/passwall2/subscribe.lua
          grep -q 'mark = (node.protocol ~= "socks") and 255 or nil,' package/passwall-luci/luci-app-passwall/luasrc/passwall/util_xray.lua
          grep -q 'mark = (node.protocol ~= "socks") and 255 or nil,' package/passwall2-luci/luci-app-passwall2/luasrc/passwall2/util_xray.lua
          ! grep -q '\\\\d+' package/passwall-luci/luci-app-passwall/luasrc/view/passwall/node_list/link_add_node.htm
          ! grep -q '\\\\d+' package/passwall2-luci/luci-app-passwall2/luasrc/view/passwall2/node_list/link_add_node.htm
          echo 'PassWall + PassWall2 SK5/HTTP importer and frontend validation verified.'

      - name: Apply package compiler compatibility fixes
        working-directory: openwrt
        run: |
          sed -i '/$(eval $(call BuildPackage,libxcrypt))/i TARGET_CFLAGS += -Wno-error=format-nonliteral' feeds/packages/libs/libxcrypt/Makefile
          grep -n -B1 -A1 'BuildPackage,libxcrypt' feeds/packages/libs/libxcrypt/Makefile

      - name: Configure all requested firmware images
        working-directory: openwrt
        run: |
          rm -f .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_/d' .config
          sed -i '/^CONFIG_PACKAGE_dnsmasq=/d;/^CONFIG_PACKAGE_dnsmasq-full=/d' .config
          cat >> .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_supergateway_s20l=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-stock=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_zbtlink_zbt-z8103ax=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt7986-firmware=y
          CONFIG_PACKAGE_mt7986-wo-firmware=y
          # CONFIG_PACKAGE_kmod-mt_wifi is not set
          # CONFIG_PACKAGE_kmod-warp is not set
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_quickstart=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          # Full proxy/plugin set
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-app-nps=y
          CONFIG_PACKAGE_luci-i18n-nps-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          # Proxy cores and common runtime dependencies
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_CCACHE=y
          CONFIG
          make defconfig
          for sym in \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_supergateway_s20l \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-stock \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-ubootmod \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jdcloud_re-cp-03 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_zbtlink_zbt-z8103ax \
            CONFIG_PACKAGE_luci-app-store CONFIG_PACKAGE_luci-app-quickstart CONFIG_PACKAGE_quickstart \
            CONFIG_PACKAGE_luci-app-passwall CONFIG_PACKAGE_luci-app-passwall2 \
            CONFIG_PACKAGE_luci-app-openclash CONFIG_PACKAGE_luci-app-homeproxy \
            CONFIG_PACKAGE_luci-app-nps CONFIG_PACKAGE_npc \
            CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_dnsmasq-full \
            CONFIG_PACKAGE_xray-core CONFIG_PACKAGE_sing-box; do
            grep -qx "$sym=y" .config || { echo "ERROR: $sym unavailable"; exit 1; }
          done

      - name: Apply login and stable mt76 WiFi defaults
        working-directory: openwrt
        run: |
          sed -i 's/192\.168\.[0-9]*\.[0-9]*/192.168.7.1/g' package/base-files/files/bin/config_generate
          mkdir -p files/etc
          cp package/base-files/files/etc/shadow files/etc/shadow
          HASH="$(openssl passwd -1 '@password@')"
          sed -i "s#^root:[^:]*:#root:${HASH}:#" files/etc/shadow
          chmod 600 files/etc/shadow

          cat > files/etc/openwrt_release <<'RELEASE'
          DISTRIB_ID='JulLiangTK'
          DISTRIB_RELEASE='24.10'
          DISTRIB_REVISION='V5-OpenWiFi-SingleWiFi-DHCP-MAC-Fix-by-jontao'
          DISTRIB_TARGET='mediatek/filogic'
          DISTRIB_ARCH='aarch64_cortex-a53'
          DISTRIB_DESCRIPTION='JuLiangTK OS V5 OpenWiFi SingleWiFi DHCP-MAC-Fix by:jontao'
          DISTRIB_TAINTS=''
          RELEASE
          cat > files/etc/os-release <<'OSRELEASE'
          NAME="JulLiangTK"
          VERSION="JuLiangTK OS V5 OpenWiFi SingleWiFi DHCP-MAC-Fix by:jontao"
          ID="juliangtk"
          PRETTY_NAME="JuLiangTK OS V5 OpenWiFi SingleWiFi DHCP-MAC-Fix by:jontao"
          HOME_URL="https://github.com/wangjontao"
          OSRELEASE

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/97-juliang-system-wifi <<'WIFIDEFAULT'
          #!/bin/sh
          uci -q set system.@system[0].hostname='JulLiangTK'
          uci -q commit system
          exit 0
          WIFIDEFAULT
          chmod 755 files/etc/uci-defaults/97-juliang-system-wifi
          cat > files/etc/uci-defaults/99-argon-theme <<'ARGON'
          #!/bin/sh
          uci -q set luci.main.mediaurlbase='/luci-static/argon'
          uci -q commit luci
          exit 0
          ARGON
          chmod 755 files/etc/uci-defaults/99-argon-theme

          mkdir -p files/etc/init.d
          cat > files/etc/init.d/nps-autokey <<'NPSAUTOKEY'
          #!/bin/sh /etc/rc.common
          START=95

          get_wan_mac() {
            local dev mac
            for dev in "$(uci -q get network.wan.device)" "$(uci -q get network.wan.ifname)" "$(ubus call network.interface.wan status 2>/dev/null | jsonfilter -e '@.device' 2>/dev/null)" "$(ip -4 route show default 2>/dev/null | awk 'NR==1 {print $5}')" wan eth1 eth0; do
              [ -n "$dev" ] || continue
              [ -r "/sys/class/net/$dev/address" ] || continue
              mac="$(cat "/sys/class/net/$dev/address" 2>/dev/null)"
              [ -n "$mac" ] || continue
              [ "$mac" = "00:00:00:00:00:00" ] && continue
              echo "$mac"
              return 0
            done
            return 1
          }

          update_nps_key() {
            local mac key
            mac="$(get_wan_mac)" || return 0
            key="$(printf '%s' "$mac" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            uci -q get nps.@nps[0] >/dev/null || uci -q add nps nps >/dev/null
            uci -q set nps.@nps[0].enabled='1'
            uci -q set nps.@nps[0].server_addr='nps.jontao.top'
            uci -q set nps.@nps[0].server_port='8024'
            uci -q set nps.@nps[0].protocol='tcp'
            uci -q set nps.@nps[0].compress='1'
            uci -q set nps.@nps[0].crypt='1'
            uci -q set nps.@nps[0].log_level='4'
            uci -q set nps.@nps[0].vkey="$key"
            uci -q commit nps
            logger -t nps-autokey "configured nps.jontao.top:8024 from WAN MAC"
          }

          start() { update_nps_key; }
          boot() { update_nps_key; }
          NPSAUTOKEY
          chmod 755 files/etc/init.d/nps-autokey

          cat > files/etc/uci-defaults/98-nps-autokey <<'NPSDEFAULT'
          #!/bin/sh
          /etc/init.d/nps-autokey enable
          /etc/init.d/nps enable
          /etc/init.d/nps-autokey start
          /etc/init.d/nps restart >/dev/null 2>&1 || true
          exit 0
          NPSDEFAULT
          chmod 755 files/etc/uci-defaults/98-nps-autokey

          mkdir -p files/etc/hotplug.d/iface
          cat > files/etc/hotplug.d/iface/99-nps-autokey <<'NPSHOTPLUG'
          #!/bin/sh
          [ "$ACTION" = "ifup" ] || exit 0
          [ "$INTERFACE" = "wan" ] || exit 0
          /etc/init.d/nps-autokey start
          /etc/init.d/nps restart >/dev/null 2>&1 || true
          NPSHOTPLUG
          chmod 755 files/etc/hotplug.d/iface/99-nps-autokey



          mkdir -p files/usr/libexec files/etc/init.d
          cat > files/usr/libexec/juliang-singlewifi-setup <<'SINGLEWIFI'
          #!/bin/sh
          set -eu
          MARKER=/etc/juliang-singlewifi.done
          [ -e "$MARKER" ] && exit 0
          [ -s /etc/config/wireless ] || wifi config >/dev/null 2>&1 || true

          radio2=''
          radio5=''
          for dev in $(uci -q show wireless | sed -n "s/^wireless\.\([^.=]*\)=wifi-device$/\1/p"); do
            band="$(uci -q get wireless.$dev.band || true)"
            hwmode="$(uci -q get wireless.$dev.hwmode || true)"
            if [ "$band" = '5g' ] || [ "$hwmode" = '11a' ]; then
              [ -n "$radio5" ] || radio5="$dev"
            else
              [ -n "$radio2" ] || radio2="$dev"
            fi
          done
          [ -n "$radio2" ] || radio2='radio0'
          [ -n "$radio5" ] || radio5='radio1'

          uci -q set wireless.$radio2.disabled='0'
          uci -q set wireless.$radio5.disabled='0'
          uci -q set wireless.$radio2.channel='9'
          uci -q set wireless.$radio5.channel='48'

          found2=0
          found5=0
          for iface in $(uci -q show wireless | sed -n "s/^wireless\.\([^.=]*\)=wifi-iface$/\1/p"); do
            dev="$(uci -q get wireless.$iface.device || true)"
            [ "$dev" = "$radio2" ] || [ "$dev" = "$radio5" ] || continue
            uci -q set wireless.$iface.mode='ap'
            uci -q set wireless.$iface.network='lan'
            uci -q set wireless.$iface.encryption='psk2'
            uci -q set wireless.$iface.key='a1111111'
            uci -q set wireless.$iface.disabled='0'
            if [ "$dev" = "$radio2" ]; then
              uci -q set wireless.$iface.ssid='JuLiang-2.4G'
              found2=1
            else
              uci -q set wireless.$iface.ssid='JuLiang-5G'
              found5=1
            fi
          done

          if [ "$found2" = 0 ]; then
            uci set wireless.juliang_24g='wifi-iface'
            uci set wireless.juliang_24g.device="$radio2"
            uci set wireless.juliang_24g.mode='ap'
            uci set wireless.juliang_24g.network='lan'
            uci set wireless.juliang_24g.ssid='JuLiang-2.4G'
            uci set wireless.juliang_24g.encryption='psk2'
            uci set wireless.juliang_24g.key='a1111111'
            uci set wireless.juliang_24g.disabled='0'
          fi
          if [ "$found5" = 0 ]; then
            uci set wireless.juliang_5g='wifi-iface'
            uci set wireless.juliang_5g.device="$radio5"
            uci set wireless.juliang_5g.mode='ap'
            uci set wireless.juliang_5g.network='lan'
            uci set wireless.juliang_5g.ssid='JuLiang-5G'
            uci set wireless.juliang_5g.encryption='psk2'
            uci set wireless.juliang_5g.key='a1111111'
            uci set wireless.juliang_5g.disabled='0'
          fi

          uci commit wireless
          touch "$MARKER"
          wifi reload >/dev/null 2>&1 || true
          logger -t juliang-singlewifi 'stable mt76 radios enabled'
          SINGLEWIFI
          chmod 755 files/usr/libexec/juliang-singlewifi-setup

          cat > files/etc/init.d/juliang-singlewifi-firstboot <<'SINGLEINIT'
          #!/bin/sh /etc/rc.common
          START=99
          start() {
            [ -e /etc/juliang-singlewifi.done ] && return 0
            ( sleep 45; /usr/libexec/juliang-singlewifi-setup; /etc/init.d/juliang-singlewifi-firstboot disable ) &
          }
          SINGLEINIT
          chmod 755 files/etc/init.d/juliang-singlewifi-firstboot

          cat > files/etc/uci-defaults/99-juliang-singlewifi-enable <<'SINGLEDEFAULT'
          #!/bin/sh
          /etc/init.d/juliang-singlewifi-firstboot enable
          ( sleep 45; /usr/libexec/juliang-singlewifi-setup; /etc/init.d/juliang-singlewifi-firstboot disable ) &
          exit 0
          SINGLEDEFAULT
          chmod 755 files/etc/uci-defaults/99-juliang-singlewifi-enable

          bash "$GITHUB_WORKSPACE/scripts/install-wan-dhcp-mac-fix.sh" "$PWD/files"

          ./scripts/diffconfig.sh | tee MT7986-AX6000-S20L-Baili-final.config

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: mt7986-openwifi-ccache-${{ runner.os }}-${{ env.SOURCE_HASH }}-${{ github.run_id }}
          restore-keys: |
            mt7986-openwifi-ccache-${{ runner.os }}-${{ env.SOURCE_HASH }}-
            mt7986-openwifi-ccache-${{ runner.os }}-

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: mt7986-openwifi-toolchain-${{ runner.os }}-${{ env.SOURCE_HASH }}-v1

      - name: Preinstall Argon Realtime-IP v4
        working-directory: openwrt
        run: |
          install -D -m0755 "$GITHUB_WORKSPACE/profiles/realtime-ip-v4/install-argon-realtime-ip-v4.sh" files/usr/bin/install-argon-realtime-ip-v4
          cat > files/etc/uci-defaults/95-argon-realtime-ip-v4 <<'REALTIMEIP'
          #!/bin/sh
          /usr/bin/install-argon-realtime-ip-v4 >/tmp/install-argon-realtime-ip-v4.log 2>&1 || exit 1
          exit 0
          REALTIMEIP
          chmod 0755 files/etc/uci-defaults/95-argon-realtime-ip-v4

      - name: Restore download cache
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: mt7986-openwifi-2410-dl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mt7986-openwifi-2410-dl-

      - name: Download and compile
        working-directory: openwrt
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          ccache -M 5G || true
          # Do not reuse partially populated Go module trees from an interrupted run.
          rm -rf dl/go-mod-cache
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete
          df -h /
          make -j"$(nproc)" || { df -h /; make -j1 V=s; }

      - name: Save download cache
        if: ${{ always() && steps.downloads.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Preserve raw target output
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MT7986-S20L-AX6000-Realtime-IP-v5-V5-OpenWiFi-SingleWiFi-DHCP-MAC-Fix-raw-${{ env.BUILD_DATE }}
          path: openwrt/bin/targets/mediatek/filogic/*
          if-no-files-found: warn
          retention-days: 30
      - name: Verify and collect firmware
        working-directory: openwrt
        run: |
          mkdir -p upload
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f\n' | sort
          for pattern in supergateway_s20l xiaomi_redmi-router-ax6000-stock xiaomi_redmi-router-ax6000-ubootmod jdcloud_re-cp-03 zbtlink_zbt-z8103ax; do
            mapfile -t files < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname "*${pattern}*" \( -iname "*.bin" -o -iname "*.itb" \) -size +5M)
            [ "${#files[@]}" -gt 0 ] || { echo "ERROR: ${pattern} firmware missing"; exit 1; }
            cp -a "${files[@]}" upload/
          done
          cp MT7986-AX6000-S20L-Baili-final.config upload/
          sha256sum upload/* | tee upload/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
