name: One-shot patch libxcrypt and rerun

on:
  push:
    branches:
      - jontaoNpS-mt7981-final-10wifi-istore-multidevice

permissions:
  contents: write
  actions: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: jontaoNpS-mt7981-final-10wifi-istore-multidevice
          fetch-depth: 0

      - name: Patch original workflow and rerun
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: jontaoNpS-mt7981-final-10wifi-istore-multidevice
          TARGET_WORKFLOW: .github/workflows/MT7981-Final-10WiFi-iStore-MultiDevice.yml
          SELF_WORKFLOW: .github/workflows/one-shot-fix-libxcrypt.yml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(".github/workflows/MT7981-Final-10WiFi-iStore-MultiDevice.yml")
          s = p.read_text()
          if "Wno-error=format-nonliteral" not in s:
              needle = """          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart

      - name: Pin original ehang NPS client 0.26.10 and enable domain server"""
              replacement = """          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart

      - name: Fix libxcrypt GCC format-nonliteral Werror
        working-directory: openwrt
        run: |
          LIBXCRYPT_MAKEFILE=feeds/packages/libs/libxcrypt/Makefile
          test -f "$LIBXCRYPT_MAKEFILE"
          if ! grep -q 'Wno-error=format-nonliteral' "$LIBXCRYPT_MAKEFILE"; then
            sed -i '/include $(INCLUDE_DIR)\\/package.mk/i TARGET_CFLAGS += -Wno-error=format-nonliteral' "$LIBXCRYPT_MAKEFILE"
          fi
          grep -n 'Wno-error=format-nonliteral' "$LIBXCRYPT_MAKEFILE"
          echo 'Patched libxcrypt format-nonliteral warning so -Werror does not abort the build.'

      - name: Pin original ehang NPS client 0.26.10 and enable domain server"""
              if needle not in s:
                  raise SystemExit("Patch insertion point not found")
              p.write_text(s.replace(needle, replacement, 1))
          PY

          rm -f "$SELF_WORKFLOW"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_WORKFLOW" "$SELF_WORKFLOW"
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix libxcrypt format-nonliteral Werror"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

          gh workflow run "$TARGET_WORKFLOW" --ref "$TARGET_BRANCH"
