name: MT7981 JuLiang FastACL2.4.4 MainWiFi NPS-Domain Multi-Device

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mt7981-fastacl244-mainwifi-domain

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-24.10.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [1010V1, 1010V2-10WiFi]
    env:
      BUILD_VARIANT: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Actions-OpenWrt
        uses: actions/checkout@v4

      - name: Free disk and install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq \
            openssl ccache zstd lua5.1
          sudo apt-get clean
          df -h /

      - name: Clone ImmortalWrt 24.10 MTWiFi source
        run: |
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "SOURCE_HASH=$(git -C openwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Add verified AGS21 and Newland device definitions
        working-directory: openwrt
        run: |
          PATCH="$GITHUB_WORKSPACE/profiles/mt7981-final-multidevice"
          cp "$PATCH"/mt7981b-*.dts target/linux/mediatek/dts/
          cp "$PATCH/02_network" target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          for dev in aigo_ags21 newland_nl-wr8103 newland_nl-wr9103; do
            if ! grep -q "TARGET_DEVICES += ${dev}" target/linux/mediatek/image/filogic.mk; then
              sed -n "/^define Device\/${dev}$/,/^TARGET_DEVICES += ${dev}$/p" "$PATCH/custom-devices.mk" >> target/linux/mediatek/image/filogic.mk
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('target/linux/mediatek/image/filogic.mk')
          s = p.read_text()
          a = s.index('define Device/jcg_q30-pro')
          b = s.index('endef', a)
          block = s[a:b]
          if re.search(r'^  IMAGE_SIZE := .*$', block, re.M):
              block = re.sub(r'^  IMAGE_SIZE := .*$', '  IMAGE_SIZE := 113152k', block, flags=re.M)
          else:
              block = block.replace('  PAGESIZE := 2048\n', '  PAGESIZE := 2048\n  IMAGE_SIZE := 113152k\n')
          s = s[:a] + block + s[b:]
          p.write_text(s)
          PY
          Q30_DTS=target/linux/mediatek/dts/mt7981b-jcg-q30-pro.dts
          grep -q 'reg = <0x0580000 0x6e80000>;' "$Q30_DTS"
          grep -q 'reg = <0xa0024 0x6>;' "$Q30_DTS"
          grep -q 'reg = <0xa002a 0x6>;' "$Q30_DTS"
          sed -n '/^define Device\/jcg_q30-pro$/,/^endef$/p' target/linux/mediatek/image/filogic.mk | grep -q 'IMAGE_SIZE := 113152k'
          echo 'Applied verified Q30 Pro 110M UBI and Factory MAC layout.'

      - name: Verify closed WiFi and all device definitions
        working-directory: openwrt
        run: |
          grep -q 'PKG_VERSION:=7.6.6.1' package/mtk/drivers/mt_wifi/Makefile
          test -s package/mtk/drivers/warp/Makefile
          for dts in mt7981b-aigo-ags21 mt7981b-newland-nl-wr8103 mt7981b-newland-nl-wr9103; do test -s target/linux/mediatek/dts/${dts}.dts; done
          for dev in philips_hy3000 cmcc_rax3000m-nand-mtk cmcc_rax3000m-emmc-mtk qihoo_360t7 aigo_ags21 cmcc_a10-ubootmod konka_komi-a31 newland_nl-wr8103 newland_nl-wr9103 abt_asr3000 jcg_q30-pro; do
            grep -q "TARGET_DEVICES += ${dev}" target/linux/mediatek/image/filogic.mk
          done
          echo 'Verified kernel 6.6 MTWiFi 7.6.6.1, WARP and all eleven build targets.'

      - name: Update standard feeds and install JuLiang dashboard
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf package/luci-app-juliang-dashboard
          cp -a "$GITHUB_WORKSPACE/juliang-dashboard/luci-app-juliang-dashboard" package/
          test -s package/luci-app-juliang-dashboard/Makefile
          test -s package/luci-app-juliang-dashboard/luasrc/controller/juliang.lua

      - name: Pin original ehang NPS client 0.26.10 and enable domain server
        working-directory: openwrt
        run: |
          NPS_MAKEFILE=feeds/packages/net/nps/Makefile
          sed -i 's/^PKG_VERSION:=.*/PKG_VERSION:=0.26.10/' "$NPS_MAKEFILE"
          sed -i 's#^PKG_SOURCE_URL:=.*#PKG_SOURCE_URL:=https://codeload.github.com/ehang-io/nps/tar.gz/v$(PKG_VERSION)?#' "$NPS_MAKEFILE"
          sed -i 's/^PKG_HASH:=.*/PKG_HASH:=1b2fe9d251f55105d65027a1cee464f65d2f6ab3bd4a20e4655e5135db68aee7/' "$NPS_MAKEFILE"
          grep -q '^PKG_VERSION:=0.26.10$' "$NPS_MAKEFILE"
          grep -q 'github.com/ehang-io/nps' "$NPS_MAKEFILE"
          for nps_lua in feeds/luci/applications/luci-app-nps/luasrc/model/cbi/nps.lua package/feeds/luci/luci-app-nps/luasrc/model/cbi/nps.lua; do
            [ -f "$nps_lua" ] || continue
            sed -i -E 's/server\.datatype[[:space:]]*=[[:space:]]*"ipaddr"/server.datatype="host"/' "$nps_lua"
            sed -i 's/Must an IPv4 address/IPv4 address or domain name/' "$nps_lua"
          done
          grep -q 'server.datatype="host"' feeds/luci/applications/luci-app-nps/luasrc/model/cbi/nps.lua
          echo 'Pinned original ehang-io NPC 0.26.10 for server compatibility.'

      - name: Pin Passwall 26.3.6-1 and add Passwall2 26.3.5-1
        working-directory: openwrt
        run: |
          rm -rf feeds/luci/applications/luci-app-passwall package/feeds/luci/luci-app-passwall
          rm -rf package/passwall-luci package/passwall2-luci
          git clone --depth=1 --single-branch --branch 26.3.6-1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
          git clone --depth=1 --single-branch --branch 26.3.5-1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/passwall2-luci
          test "$(git -C package/passwall-luci describe --tags --exact-match)" = "26.3.6-1"
          test "$(git -C package/passwall2-luci describe --tags --exact-match)" = "26.3.5-1"

      - name: Apply package compiler compatibility fixes
        working-directory: openwrt
        run: |
          sed -i '/$(eval $(call BuildPackage,libxcrypt))/i TARGET_CFLAGS += -Wno-error=format-nonliteral' feeds/packages/libs/libxcrypt/Makefile
          grep -n -B1 -A1 'BuildPackage,libxcrypt' feeds/packages/libs/libxcrypt/Makefile

      - name: Configure all requested firmware images
        working-directory: openwrt
        run: |
          cp defconfig/mt7981-ax3000.config .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_/d' .config
          sed -i '/^CONFIG_PACKAGE_dnsmasq=/d;/^CONFIG_PACKAGE_dnsmasq-full=/d' .config
          cat >> .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc-mtk=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_aigo_ags21=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_a10-ubootmod=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_konka_komi-a31=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_newland_nl-wr8103=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_newland_nl-wr9103=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_abt_asr3000=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro=y
          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
          CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-juliang-dashboard=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          # Full proxy/plugin set
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-app-nps=y
          CONFIG_PACKAGE_luci-i18n-nps-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          # Proxy cores and common runtime dependencies
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_dns2socks=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_CCACHE=y
          CONFIG
          make defconfig
          for sym in \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc-mtk \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_aigo_ags21 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_a10-ubootmod \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_konka_komi-a31 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_newland_nl-wr8103 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_newland_nl-wr9103 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_abt_asr3000 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro \
            CONFIG_PACKAGE_kmod-mt_wifi CONFIG_PACKAGE_kmod-warp \
            CONFIG_PACKAGE_luci-app-juliang-dashboard \
            CONFIG_PACKAGE_luci-app-passwall CONFIG_PACKAGE_luci-app-passwall2 \
            CONFIG_PACKAGE_luci-app-openclash CONFIG_PACKAGE_luci-app-homeproxy \
            CONFIG_PACKAGE_luci-app-nps CONFIG_PACKAGE_npc \
            CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_dnsmasq-full \
            CONFIG_PACKAGE_xray-core CONFIG_PACKAGE_sing-box; do
            grep -qx "$sym=y" .config || { echo "ERROR: $sym unavailable"; exit 1; }
          done

      - name: Apply login and MTWiFi defaults
        working-directory: openwrt
        run: |
          sed -i 's/192\.168\.[0-9]*\.[0-9]*/192.168.7.1/g' package/base-files/files/bin/config_generate
          sed -i -e 's/^SSID1=.*/SSID1=DulWiFi-2.4G/' -e 's/^Channel=.*/Channel=9/' \
            -e 's/^AuthMode=.*/AuthMode=WPA2PSK/' -e 's/^EncrypType=.*/EncrypType=AES/' \
            -e 's/^WPAPSK1=.*/WPAPSK1=password/' \
            package/mtk/drivers/wifi-profile/files/mt7981/mt7981.dbdc.b0.dat
          sed -i -e 's/^SSID1=.*/SSID1=DulWiFi-5G/' -e 's/^Channel=.*/Channel=48/' \
            -e 's/^AuthMode=.*/AuthMode=WPA2PSK/' -e 's/^EncrypType=.*/EncrypType=AES/' \
            -e 's/^WPAPSK1=.*/WPAPSK1=password/' \
            package/mtk/drivers/wifi-profile/files/mt7981/mt7981.dbdc.b1.dat
          mkdir -p files/etc
          cp package/base-files/files/etc/shadow files/etc/shadow
          HASH="$(openssl passwd -1 '@password@')"
          sed -i "s#^root:[^:]*:#root:${HASH}:#" files/etc/shadow
          chmod 600 files/etc/shadow

          cat > files/etc/openwrt_release <<'RELEASE'
          DISTRIB_ID='JuLiang'
          DISTRIB_RELEASE='24.10'
          DISTRIB_REVISION='by:jontao'
          DISTRIB_TARGET='mediatek/filogic'
          DISTRIB_ARCH='aarch64_cortex-a53'
          DISTRIB_DESCRIPTION='JuLiang OS by:jontao'
          DISTRIB_TAINTS=''
          RELEASE
          cat > files/etc/os-release <<'OSRELEASE'
          NAME="JuLiang"
          VERSION="JuLiang OS by:jontao"
          ID="juliang"
          PRETTY_NAME="JuLiang OS by:jontao"
          HOME_URL="https://github.com/wangjontao"
          OSRELEASE

          mkdir -p files/etc/uci-defaults files/etc/init.d files/usr/libexec
          cat > files/etc/uci-defaults/97-juliang-system-wifi <<'WIFIDEFAULT'
          #!/bin/sh
          uci -q set system.@system[0].hostname='JuLiang'
          uci -q commit system
          for f in /etc/wireless/mediatek/*b0.dat; do
            [ -f "$f" ] || continue
            sed -i -e 's/^SSID1=.*/SSID1=DulWiFi-2.4G/' -e 's/^Channel=.*/Channel=9/' \
              -e 's/^AuthMode=.*/AuthMode=WPA2PSK/' -e 's/^EncrypType=.*/EncrypType=AES/' \
              -e 's/^WPAPSK1=.*/WPAPSK1=password/' "$f"
          done
          for f in /etc/wireless/mediatek/*b1.dat; do
            [ -f "$f" ] || continue
            sed -i -e 's/^SSID1=.*/SSID1=DulWiFi-5G/' -e 's/^Channel=.*/Channel=48/' \
              -e 's/^AuthMode=.*/AuthMode=WPA2PSK/' -e 's/^EncrypType=.*/EncrypType=AES/' \
              -e 's/^WPAPSK1=.*/WPAPSK1=password/' "$f"
          done
          exit 0
          WIFIDEFAULT
          chmod 755 files/etc/uci-defaults/97-juliang-system-wifi

          cat > files/etc/init.d/juliang-wifi-defaults <<'WIFISERVICE'
          #!/bin/sh /etc/rc.common
          START=99
          USE_PROCD=1
          DONE=/etc/juliang-wifi-ssidfix2.done
          start_service() {
            [ -e "$DONE" ] && return 0
            procd_open_instance
            procd_set_param command /bin/sh -c 'sleep 60; /usr/libexec/juliang-wifi-defaults'
            procd_set_param stdout 1
            procd_set_param stderr 1
            procd_close_instance
          }
          WIFISERVICE
          cat > files/usr/libexec/juliang-wifi-defaults <<'WIFIAPPLY'
          #!/bin/sh
          set -e
          DONE=/etc/juliang-wifi-ssidfix2.done
          [ -e "$DONE" ] && exit 0
          for f in /etc/wireless/mediatek/*b0.dat; do
            [ -f "$f" ] || continue
            sed -i -e 's/^SSID1=.*/SSID1=DulWiFi-2.4G/' -e 's/^Channel=.*/Channel=9/' \
              -e 's/^AuthMode=.*/AuthMode=WPA2PSK/' -e 's/^EncrypType=.*/EncrypType=AES/' \
              -e 's/^WPAPSK1=.*/WPAPSK1=password/' "$f"
          done
          for f in /etc/wireless/mediatek/*b1.dat; do
            [ -f "$f" ] || continue
            sed -i -e 's/^SSID1=.*/SSID1=DulWiFi-5G/' -e 's/^Channel=.*/Channel=48/' \
              -e 's/^AuthMode=.*/AuthMode=WPA2PSK/' -e 's/^EncrypType=.*/EncrypType=AES/' \
              -e 's/^WPAPSK1=.*/WPAPSK1=password/' "$f"
          done
          for radio in $(uci -q show wireless | sed -n 's/^wireless\.\([^=]*\)=wifi-device$/\1/p'); do
            band="$(uci -q get wireless.$radio.band)"; hw="$(uci -q get wireless.$radio.hwmode)"
            case "$band:$hw" in 2g:*|*:11g) uci set wireless.$radio.channel='9';; 5g:*|*:11a) uci set wireless.$radio.channel='48';; esac
          done
          for iface in $(uci -q show wireless | sed -n 's/^wireless\.\([^=]*\)=wifi-iface$/\1/p'); do
            [ "$(uci -q get wireless.$iface.jfa_owner)" = fastacl-batch-v1 ] && continue
            radio="$(uci -q get wireless.$iface.device)"; band="$(uci -q get wireless.$radio.band)"; hw="$(uci -q get wireless.$radio.hwmode)"
            case "$band:$hw" in 2g:*|*:11g) ssid='DulWiFi-2.4G';; 5g:*|*:11a) ssid='DulWiFi-5G';; *) continue;; esac
            uci set wireless.$iface.ssid="$ssid"
            uci set wireless.$iface.encryption='psk2+ccmp'
            uci set wireless.$iface.key='password'
            uci set wireless.$iface.disabled='0'
          done
          uci commit wireless
          wifi reload
          touch "$DONE"
          /etc/init.d/juliang-wifi-defaults disable >/dev/null 2>&1 || true
          logger -t juliang-wifi 'Applied DulWiFi dual-band defaults after overlay restore'
          WIFIAPPLY
          cat > files/etc/uci-defaults/97-enable-juliang-wifi-defaults <<'WIFIENABLE'
          #!/bin/sh
          /etc/init.d/juliang-wifi-defaults enable
          /etc/init.d/juliang-wifi-defaults start
          exit 0
          WIFIENABLE
          chmod 755 files/etc/init.d/juliang-wifi-defaults files/usr/libexec/juliang-wifi-defaults files/etc/uci-defaults/97-enable-juliang-wifi-defaults
          cat > files/etc/uci-defaults/99-argon-theme <<'ARGON'
          #!/bin/sh
          uci -q set luci.main.mediaurlbase='/luci-static/argon'
          uci -q commit luci
          exit 0
          ARGON
          chmod 755 files/etc/uci-defaults/99-argon-theme

          mkdir -p files/etc/init.d
          cat > files/etc/init.d/nps-autokey <<'NPSAUTOKEY'
          #!/bin/sh /etc/rc.common
          START=95
          DONE=/etc/nps-wan-mac.done

          get_wan_mac() {
            local dev mac
            for dev in "$(uci -q get network.wan.device)" "$(uci -q get network.wan.ifname)" "$(ubus call network.interface.wan status 2>/dev/null | jsonfilter -e '@.device' 2>/dev/null)" "$(ip -4 route show default 2>/dev/null | awk 'NR==1 {print $5}')" wan eth1 eth0; do
              [ -n "$dev" ] || continue
              [ -r "/sys/class/net/$dev/address" ] || continue
              mac="$(cat "/sys/class/net/$dev/address" 2>/dev/null)"
              [ -n "$mac" ] || continue
              [ "$mac" = "00:00:00:00:00:00" ] && continue
              echo "$mac"
              return 0
            done
            return 1
          }

          update_nps_key() {
            [ -e "$DONE" ] && return 0
            local mac key
            mac="$(get_wan_mac)" || return 0
            key="$(printf '%s' "$mac" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            uci -q get nps.@nps[0] >/dev/null || uci -q add nps nps >/dev/null
            uci -q set nps.@nps[0].enabled='1'
            uci -q set nps.@nps[0].server_addr='nps.jontao.top'
            uci -q set nps.@nps[0].server_port='8024'
            uci -q set nps.@nps[0].protocol='tcp'
            uci -q set nps.@nps[0].compress='1'
            uci -q set nps.@nps[0].crypt='1'
            uci -q set nps.@nps[0].log_level='4'
            uci -q set nps.@nps[0].vkey="$key"
            uci -q commit nps
            touch "$DONE"
            /etc/init.d/nps-autokey disable >/dev/null 2>&1 || true
            logger -t nps-autokey "configured nps.jontao.top:8024 from WAN MAC"
          }

          start() { update_nps_key; }
          boot() { update_nps_key; }
          NPSAUTOKEY
          chmod 755 files/etc/init.d/nps-autokey

          cat > files/etc/uci-defaults/98-nps-autokey <<'NPSDEFAULT'
          #!/bin/sh
          /etc/init.d/nps-autokey enable
          /etc/init.d/nps enable
          /etc/init.d/nps-autokey start
          /etc/init.d/nps restart >/dev/null 2>&1 || true
          exit 0
          NPSDEFAULT
          chmod 755 files/etc/uci-defaults/98-nps-autokey

          mkdir -p files/etc/hotplug.d/iface
          cat > files/etc/hotplug.d/iface/99-nps-autokey <<'NPSHOTPLUG'
          #!/bin/sh
          [ "$ACTION" = "ifup" ] || exit 0
          [ "$INTERFACE" = "wan" ] || exit 0
          [ -e /etc/nps-wan-mac.done ] && exit 0
          /etc/init.d/nps-autokey start
          /etc/init.d/nps restart >/dev/null 2>&1 || true
          NPSHOTPLUG
          chmod 755 files/etc/hotplug.d/iface/99-nps-autokey


          grep -q "server_addr='nps.jontao.top'" files/etc/init.d/nps-autokey
          grep -q 'vkey="$key"' files/etc/init.d/nps-autokey
          grep -q 'DONE=/etc/nps-wan-mac.done' files/etc/init.d/nps-autokey
          grep -q 'touch "$DONE"' files/etc/init.d/nps-autokey
          grep -q '/etc/init.d/nps restart' files/etc/uci-defaults/98-nps-autokey
          grep -q "DISTRIB_ID='JuLiang'" files/etc/openwrt_release
          test -s package/luci-app-juliang-dashboard/luasrc/view/juliang/dashboard.htm
          grep -q "SSID1=DulWiFi-2.4G" files/usr/libexec/juliang-wifi-defaults
          grep -q "SSID1=DulWiFi-5G" files/usr/libexec/juliang-wifi-defaults
          grep -q "uci commit wireless" files/usr/libexec/juliang-wifi-defaults
          ./scripts/diffconfig.sh | tee MT7981-MTWiFi-final.config

      - name: Integrate and validate FastACL 2.4.4
        working-directory: openwrt
        run: sh "$GITHUB_WORKSPACE/scripts/integrate-fastacl244-juliang-mt7981.sh"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: mt7981-mtwifi-ccache-${{ runner.os }}-${{ env.SOURCE_HASH }}-${{ github.run_id }}
          restore-keys: |
            mt7981-mtwifi-ccache-${{ runner.os }}-${{ env.SOURCE_HASH }}-
            mt7981-mtwifi-ccache-${{ runner.os }}-

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: mt7981-mtwifi-toolchain-${{ runner.os }}-${{ env.SOURCE_HASH }}-v1

      - name: Restore download cache
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: mt7981-mtwifi-2410-dl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mt7981-mtwifi-2410-dl-

      - name: Download and compile
        working-directory: openwrt
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          ccache -M 5G || true
          # Do not reuse partially populated Go module trees from an interrupted run.
          rm -rf dl/go-mod-cache
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete
          df -h /
          make -j"$(nproc)" || { df -h /; make -j1 V=s; }

      - name: Save download cache
        if: ${{ always() && steps.downloads.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Preserve raw target output
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MT7981-JuLiang-FastACL2.4.4-${{ matrix.variant }}-MainWiFi-NPS-Domain-raw-${{ env.BUILD_DATE }}
          path: openwrt/bin/targets/mediatek/filogic/*
          if-no-files-found: warn
          retention-days: 30
      - name: Verify and collect firmware
        working-directory: openwrt
        run: |
          mkdir -p upload
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f\n' | sort
          for pattern in philips_hy3000 cmcc_rax3000m-nand-mtk cmcc_rax3000m-emmc-mtk qihoo_360t7 aigo_ags21 cmcc_a10-ubootmod konka_komi-a31 newland_nl-wr8103 newland_nl-wr9103 abt_asr3000 jcg_q30-pro; do
            mapfile -t files < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname "*${pattern}*" \( -iname "*.bin" -o -iname "*.itb" \) -size +5M)
            [ "${#files[@]}" -gt 0 ] || { echo "ERROR: ${pattern} firmware missing"; exit 1; }
            cp -a "${files[@]}" upload/
          done
          for f in upload/*konka_komi-a31*; do
            [ -f "$f" ] || continue
            cp -a "$f" "${f/konka_komi-a31/etr631-t}"
            cp -a "$f" "${f/konka_komi-a31/etr635-u}"
          done
          cp MT7981-MTWiFi-final.config upload/
          sha256sum upload/* | tee upload/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: MT7981-JuLiang-FastACL2.4.4-${{ matrix.variant }}-MainWiFi-NPS-Domain-24.10-${{ env.BUILD_DATE }}
          name: MT7981 JuLiang FastACL2.4.4 ${{ matrix.variant }} MainWiFi NPS-Domain Multi-Device ${{ env.BUILD_DATE }}
          files: openwrt/upload/*
          body: |
            Experimental ImmortalWrt 24.10 kernel 6.6 closed MTWiFi build.
            Devices: Philips HY3000, CMCC RAX3000M NAND/eMMC, Qihoo 360T7, AGS21, CMCC A10 U-Boot mod, ETR631-T/ETR635-U (KOMI A31), Newland 8103/9103, Ambit ASR3000 and JCG Q30 Pro.
            Driver: mt_wifi 7.6.6.1 with matching WARP. Management: 192.168.7.1, root password @password@.
            System/version: JuLiang; firmware description: JuLiang OS by:jontao.
            FastACL: 2.4.4 with SOCKS5/SK5/HTTP batch import, proxy chains and corrected PassWall ACL templates. Variant ${{ matrix.variant }}: V1 allows four additional 5GHz and one 2.4GHz; V2-10WiFi allows eight additional 5GHz and three 2.4GHz; factory defaults contain main WiFi only.
            Fixes: global DNS providers, custom DoH, independent per-node DNS routing, compact DNS toolbar, gradient FastACL 2.4.4 title, corrected node DNS template.
            WiFi: DulWiFi-2.4G (channel 9) and DulWiFi-5G (channel 48), password password.
            Interface: custom JuLiang dashboard (no iStore/QuickStart), bold gradient title and public egress IP card with country flag, location, ISP and detection time. Plugins: Passwall 26.3.6-1, Passwall2 26.3.5-1, OpenClash, HomeProxy, original ehang NPS/NPC 0.26.10. Theme: Argon.
            NPS: nps.jontao.top:8024; the first successful WAN startup reads the physical WAN MAC once, removes colons, uppercases it, writes it as vkey, and never overwrites it on later boots.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MT7981-JuLiang-FastACL2.4.4-${{ matrix.variant }}-MainWiFi-NPS-Domain-MultiDevice-24.10-${{ env.BUILD_DATE }}
          path: openwrt/upload/*
          if-no-files-found: error
          retention-days: 30
