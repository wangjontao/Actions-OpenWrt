name: MT7981 iWAN SD-WAN 24.10

on:
  workflow_dispatch:
  push:
    branches:
      - mt7981-iwan

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-24.10.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  IWAND_REF: v0.2.0
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Actions-OpenWrt
        uses: actions/checkout@v4

      - name: Free disk and install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq \
            openssl ccache zstd
          sudo apt-get clean
          df -h /

      - name: Clone ImmortalWrt MT7981 source
        run: |
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "SOURCE_HASH=$(git -C openwrt rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Verify MT7981 targets
        working-directory: openwrt
        run: |
          test -s defconfig/mt7981-ax3000.config
          test -s package/mtk/drivers/mt_wifi/Makefile
          test -s package/mtk/drivers/warp/Makefile
          for dev in philips_hy3000 cmcc_rax3000m-nand-mtk cmcc_rax3000m-emmc-mtk qihoo_360t7; do
            grep -q "TARGET_DEVICES += ${dev}" target/linux/mediatek/image/filogic.mk
          done
          echo 'MT7981 source and target definitions verified.'

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Integrate Panabit iWAN client and LuCI
        working-directory: openwrt
        env:
          IWAND_REF: ${{ env.IWAND_REF }}
        run: |
          chmod +x ../scripts/install-iwand-openwrt.sh
          ../scripts/install-iwand-openwrt.sh "$PWD"
          grep -q 'PKG_NAME:=iwand' package/iwand/Makefile
          grep -q 'LUCI_DEPENDS:=+iwand' package/luci-app-iwand/Makefile
          grep -q '派网 iWAN' package/luci-app-iwand/root/usr/share/luci/menu.d/luci-app-iwand.json

      - name: Configure MT7981 iWAN firmware
        working-directory: openwrt
        run: |
          cp defconfig/mt7981-ax3000.config .config
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_/d' .config
          cat >> .config <<'CONFIG'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc-mtk=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7=y

          CONFIG_PACKAGE_kmod-mt_wifi=y
          CONFIG_PACKAGE_kmod-warp=y
          CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
          CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y

          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filemanager=y

          # Panabit iWAN SD-WAN client
          CONFIG_PACKAGE_iwand=y
          CONFIG_PACKAGE_luci-app-iwand=y
          CONFIG_PACKAGE_kmod-tun=y

          # Useful diagnostics for iWAN testing
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_mtr=y
          CONFIG_CCACHE=y
          CONFIG

          make defconfig

          for sym in \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_philips_hy3000 \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-nand-mtk \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc-mtk \
            CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_qihoo_360t7 \
            CONFIG_PACKAGE_kmod-mt_wifi CONFIG_PACKAGE_kmod-warp \
            CONFIG_PACKAGE_iwand CONFIG_PACKAGE_luci-app-iwand CONFIG_PACKAGE_kmod-tun; do
            grep -qx "$sym=y" .config || { echo "ERROR: $sym unavailable"; exit 1; }
          done

          ./scripts/diffconfig.sh | tee MT7981-iWAN-final.config

      - name: Apply JuLiang test defaults
        working-directory: openwrt
        run: |
          sed -i 's/192\.168\.[0-9]*\.[0-9]*/192.168.7.1/g' package/base-files/files/bin/config_generate

          mkdir -p files/etc
          cp package/base-files/files/etc/shadow files/etc/shadow
          HASH="$(openssl passwd -1 '@password@')"
          sed -i "s#^root:[^:]*:#root:${HASH}:#" files/etc/shadow
          chmod 600 files/etc/shadow

          cat > files/etc/openwrt_release <<'RELEASE'
          DISTRIB_ID='JuLiangTK'
          DISTRIB_RELEASE='24.10'
          DISTRIB_REVISION='MT7981-iWAN'
          DISTRIB_TARGET='mediatek/filogic'
          DISTRIB_ARCH='aarch64_cortex-a53'
          DISTRIB_DESCRIPTION='JuLiangTK MT7981 iWAN'
          DISTRIB_TAINTS=''
          RELEASE

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/98-iwan-defaults <<'IWANDEFAULT'
          #!/bin/sh
          uci -q set iwand.main.enabled='0'
          uci -q set iwand.main.interface='iwan0'
          uci -q set iwand.main.port='4567'
          uci -q set iwand.main.mtu='1400'
          uci -q set iwand.main.encrypt='0'
          uci -q commit iwand
          /etc/init.d/iwand enable >/dev/null 2>&1 || true
          exit 0
          IWANDEFAULT
          chmod 755 files/etc/uci-defaults/98-iwan-defaults

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: mt7981-iwan-ccache-${{ runner.os }}-${{ env.SOURCE_HASH }}-${{ github.run_id }}
          restore-keys: |
            mt7981-iwan-ccache-${{ runner.os }}-${{ env.SOURCE_HASH }}-
            mt7981-iwan-ccache-${{ runner.os }}-

      - name: Download and compile
        working-directory: openwrt
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          ccache -M 5G || true
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify iWAN ARM64 package and firmware
        working-directory: openwrt
        run: |
          mkdir -p upload

          IWAN_IPK="$(find bin/packages bin/targets -type f -name 'iwand_*.ipk' | head -n1)"
          LUCI_IPK="$(find bin/packages bin/targets -type f -name 'luci-app-iwand_*.ipk' | head -n1)"
          [ -n "$IWAN_IPK" ] || { echo 'ERROR: iwand ipk missing'; exit 1; }
          [ -n "$LUCI_IPK" ] || { echo 'ERROR: luci-app-iwand ipk missing'; exit 1; }
          cp -a "$IWAN_IPK" "$LUCI_IPK" upload/

          for pattern in philips_hy3000 cmcc_rax3000m-nand-mtk cmcc_rax3000m-emmc-mtk qihoo_360t7; do
            mapfile -t fw < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f -iname "*${pattern}*sysupgrade.bin" -size +5M)
            [ "${#fw[@]}" -gt 0 ] || { echo "ERROR: ${pattern} firmware missing"; exit 1; }
            cp -a "${fw[@]}" upload/
          done

          cp MT7981-iWAN-final.config upload/
          sha256sum upload/* | tee upload/SHA256SUMS

      - name: Publish MT7981 iWAN release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: MT7981-iWAN-${{ env.BUILD_DATE }}
          name: MT7981 iWAN SD-WAN ${{ env.BUILD_DATE }}
          files: openwrt/upload/*
          body: |
            MT7981 / aarch64_cortex-a53 iWAN test firmware.
            iWAN client: Ricky-Hao/iwand v0.2.0, compiled natively with the OpenWrt target toolchain.
            LuCI menu: VPN -> 派网 iWAN.
            Default iWAN interface: iwan0; service is installed and enabled but connection is disabled until server credentials are entered.
            Configure server/domain, port, username and password in LuCI, then enable and Save & Apply.
            Included targets: Philips HY3000, CMCC RAX3000M NAND, CMCC RAX3000M eMMC, Qihoo 360T7.
            Management: 192.168.7.1; root password: @password@.
            The release also includes standalone iwand and luci-app-iwand IPKs for testing on compatible MT7981 builds.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MT7981-iWAN-${{ env.BUILD_DATE }}
          path: openwrt/upload/*
          if-no-files-found: error
          retention-days: 30
