name: MT7981 FastACL 2.6.4 from ImmortalWrt 2.6.4 (Grouped)
run-name: 'FastACL 2.6.4 - 4 grouped jobs from immortalwrt-24.10@cea6b96'

'on':
  workflow_dispatch: {}
  push:
    branches: ['2.6.4']
    paths: ['.github/workflows/MT7981-FastACL264-ImmortalWrt.yml']

permissions:
  contents: read

concurrency:
  group: fastacl264-actions-immortalwrt-grouped-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Fixed-entry architecture and UI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wangjontao/immortalwrt-24.10
          ref: cea6b96c39f347897b10782787925055b649d884
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Install validation tools
        run: |
          . /etc/os-release
          printf 'deb https://archive.ubuntu.com/ubuntu %s main universe multiverse restricted\ndeb https://archive.ubuntu.com/ubuntu %s-updates main universe multiverse restricted\ndeb https://security.ubuntu.com/ubuntu %s-security main universe multiverse restricted\n' "$VERSION_CODENAME" "$VERSION_CODENAME" "$VERSION_CODENAME" > /tmp/redmi-ubuntu.list
          sudo mkdir -p /tmp/redmi-apt-lists/partial
          apt_options=(-o Dir::Etc::sourcelist=/tmp/redmi-ubuntu.list -o Dir::Etc::sourceparts=- -o Dir::State::lists=/tmp/redmi-apt-lists -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          sudo timeout 300 apt-get "${apt_options[@]}" update
          sudo timeout 600 apt-get "${apt_options[@]}" install -y --no-install-recommends lua5.1 nftables iproute2 curl shfmt
          python3 -m venv .venv
          .venv/bin/pip install lupa PyYAML playwright
          .venv/bin/playwright install --with-deps chromium
          curl -fL --retry 3 -o /tmp/dae-amd64.tar.xz \
            https://github.com/daeuniverse/dae/releases/download/v2.1.1/dae-linux-x86_64.tar.xz
          echo 'c550af580dc97cc90986260da78c4bf72917f3213c2b5d8b79c45199d9c3dc90  /tmp/dae-amd64.tar.xz' | sha256sum -c -
          mkdir /tmp/dae-core
          tar -xJf /tmp/dae-amd64.tar.xz -C /tmp/dae-core
          install -m755 "$(find /tmp/dae-core -type f -name dae | head -n1)" /tmp/dae
      - name: Validate Lite hot path and syntax
        run: |
          python3 profiles/fastacl-v252/tests/test_bbr.py
          .venv/bin/python profiles/fastacl-v252/tests/test_hardware_mac.py
          .venv/bin/python profiles/fastacl-v252/tests/test_wifi_creation.py
          python3 scripts/tests/test_ci_update_feeds.py
          .venv/bin/python profiles/fastacl-v252/tests/test_wireless.py
          .venv/bin/python profiles/fastacl-v252/tests/test_wifi_fw4.py
          .venv/bin/python profiles/fastacl-v252/tests/test_fixed_exit.py
          python3 profiles/fastacl-v252/tests/test_lite_hotpath.py
          python3 profiles/fastacl-v252/tests/test_runtime.py
          python3 profiles/fastacl-v252/tests/test_stability_262.py
          python3 scripts/tests/test_fastacl262_devices.py
          python3 profiles/fastacl-v252/tests/test_online_upgrade.py
          python3 profiles/fastacl-v252/tests/test_update_manifest.py
          python3 profiles/fastacl-v252/tests/test_traffic_totals.py
          node --check profiles/fastacl-v252/root/www/luci-static/resources/view/wan-watchdog.js
          find profiles/fastacl-v252/root -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          find profiles/fastacl-v252/root -type f | while read -r file; do
            if head -n1 "$file" | grep -q '^#!/bin/sh'; then sh -n "$file"; shfmt -ln posix "$file" >/dev/null; fi
          done
          .venv/bin/python profiles/fastacl-v252/tests/test_import.py
          .venv/bin/python profiles/fastacl-v252/tests/test_split_data.py
          .venv/bin/python profiles/fastacl-v252/tests/test_subscription.py
          .venv/bin/python profiles/fastacl-v252/tests/test_menu_cleanup.py
          .venv/bin/python profiles/fastacl-v252/tests/test_reboot.py
          .venv/bin/python profiles/fastacl-v252/tests/test_login_theme.py
      - name: Validate DNS relay and native nodes
        run: |
          (cd profiles/fastacl-v252/dns && go mod tidy && go mod vendor && python3 ../patch_outbound.py . && go test -mod=vendor -race -timeout 2m ./... && go build -mod=vendor -trimpath -o /tmp/fastacl252-dns .)
          .venv/bin/python profiles/fastacl-v252/tests/test_mihomo.py --core /tmp/dae --helper /tmp/fastacl252-dns
          for config in profiles/fastacl-v252/test-results/import-*.dae; do /tmp/dae validate -c "$config"; done
      - name: Validate quick-switch console in Chromium
        run: |
          cd profiles/fastacl-v252/tests
          ../../../.venv/bin/python test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FastACL264-MT7981-preflight-evidence
          path: profiles/fastacl-v252/test-results/*
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build ${{ matrix.label }} FastACL 2.6.4
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: hy-rax-360
            tag: HY-RAX-360
            label: HY3000 RAX3000M 360T7 AGS21
            devices: philips_hy3000 cmcc_rax3000m cmcc_rax3000m-emmc qihoo_360t7 aigo_ags21
          - group: a10-newland
            tag: A10-NEWLAND
            label: A10 KOMI A31 Newland ASR3000
            devices: cmcc_a10-ubootmod konka_komi-a31 newland_nl-wr8103 newland_nl-wr9103 abt_asr3000
          - group: q30-ax3000t
            tag: Q30-AX3000T
            label: Q30 AX3000T WR30U
            devices: jcg_q30-pro xiaomi_mi-router-ax3000t xiaomi_mi-router-ax3000t-mtkuboot xiaomi_mi-router-ax3000t-ubootmod xiaomi_mi-router-wr30u-stock
          - group: wr30u-z8103-clt
            tag: WR30U-Z8103-CLT
            label: WR30U Nokia SL3000 Z8103 CLT
            devices: xiaomi_mi-router-wr30u-ubootmod nokia_ea0326gmp sl_3000-emmc zbtlink_zbt-z8103ax-c clt_r30b1
    env:
      DEVICES: ${{ matrix.devices }}
      DEVICE_TAG: ${{ matrix.tag }}
      DEVICE_GROUP: ${{ matrix.group }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wangjontao/immortalwrt-24.10
          ref: cea6b96c39f347897b10782787925055b649d884
          persist-credentials: false
      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm nano ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          echo "WRT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p .ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false
      - name: Restore source and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: fastacl264-mt7981-grouped-${{ matrix.group }}-${{ hashFiles('build-configs/JuLiangTK-S20L-FastACL258.txt', 'profiles/fastacl-v252/package-Makefile', 'profiles/fastacl-v252/core-Makefile', 'profiles/fastacl-v252/dns/go.mod') }}
          restore-keys: |
            fastacl264-mt7981-grouped-${{ matrix.group }}-
      - name: Update feeds
        run: |
          sh scripts/ci-update-feeds.sh
          ./scripts/feeds install -a
          ./scripts/feeds install -f -p packages nps npc || true
          ./scripts/feeds install -f -p luci luci-app-nps luci-i18n-nps-zh-cn luci-app-autoreboot || true
      - name: Add Argon and NPS defaults
        run: |
          rm -rf package/luci-theme-argon package/luci-app-argon-config
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          NPS_CONFIG_FILE="$(find feeds/luci package/feeds/luci -path '*/luci-app-nps/root/etc/config/nps' -type f 2>/dev/null | head -n1)"
          if [ -n "$NPS_CONFIG_FILE" ]; then
            cat > "$NPS_CONFIG_FILE" <<'NPS_CONFIG'
          config nps
            option enabled '1'
            option server_addr 'nps.jontao.top'
            option server_port '8024'
            option protocol 'tcp'
            option compress '1'
            option crypt '1'
            option vkey 'WANMAC'
            option log_level '4'
          NPS_CONFIG
          fi
      - name: Integrate FastACL Lite
        run: |
          sh scripts/integrate-fastacl262-grouped.sh $DEVICES
          grep -q 'PKG_VERSION:=2.6.4' package/fastacl252/Makefile
          grep -q "version='2.6.4'" package/fastacl252/files/usr/lib/lua/luci/controller/fastacl252.lua
          grep -q "dae reload" package/fastacl252/files/usr/bin/fastacl252
          python3 scripts/tests/test_ci_update_feeds.py
          python3 profiles/fastacl-v252/tests/test_lite_hotpath.py
          python3 profiles/fastacl-v252/tests/test_runtime.py
      - name: Download sources
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete
      - name: Compile device firmware
        run: |
          rm -rf dl/go-mod-cache
          mkdir -p dl/go-mod-cache
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s
          make toolchain/install -j"$(nproc)" || make toolchain/install -j1 V=s
          make target/linux/compile -j"$(nproc)" V=s
          kernel=$(find build_dir/target-* -path '*/linux-mediatek_filogic/linux-6.6*/.config' | head -n1)
          test -n "$kernel"
          sh profiles/fastacl-v252/check-kernel.sh "$kernel"
          # Standalone package/compile bypasses world/prepare build metadata.
          make buildinfo
          for metadata in config feeds version; do
            test -s "bin/targets/mediatek/filogic/${metadata}.buildinfo"
          done
          make package/compile -j"$(nproc)" || make package/compile -j1 V=s
          make -j1 V=s
          kernel=$(find build_dir/target-* -path '*/linux-mediatek_filogic/linux-6.6*/.config' | head -n1)
          test -n "$kernel"
          sh profiles/fastacl-v252/check-kernel.sh "$kernel"
      - name: Verify and collect firmware
        run: |
          mkdir -p upload
          for device in $DEVICES; do
            mapfile -t images < <(find bin/targets/mediatek/filogic -maxdepth 1 -type f \( -iname "*${device}*sysupgrade*" -o -iname "*${device}*factory*" \) -size +5M)
            [ "${#images[@]}" -gt 0 ] || { echo "ERROR: $device firmware image missing"; find bin/targets/mediatek/filogic -maxdepth 1 -type f -printf '%f %s bytes\n' | sort; exit 1; }
            cp -a "${images[@]}" upload/
            manifest="$(if [ -s "bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}.manifest" ]; then echo "bin/targets/mediatek/filogic/immortalwrt-mediatek-filogic-${DEVICE}.manifest"; else find bin/targets/mediatek/filogic -maxdepth 1 -type f -name 'immortalwrt-mediatek-filogic*.manifest' -size +0c | head -n1; fi)"
            [ -s "$manifest" ] || { echo "ERROR: shared package manifest missing"; exit 1; }
            for pkg in fastacl252 juliangtk-dae lyaml luci-theme-argon luci-app-argon-config luci-app-ttyd luci-app-autoreboot nps luci-app-nps npc sqm-scripts kmod-sched-cake kmod-ifb vnstat2; do
              grep -q "^$pkg " "$manifest" || { echo "ERROR: $pkg missing from $device"; exit 1; }
            done
            if grep -Ei '^(luci-app-store|luci-app-quickstart|quickstart|taskd) ' "$manifest"; then echo "ERROR: iStore/QuickStart unexpectedly present in $device"; exit 1; fi
            if grep -Ei '^(luci-app-(passwall2?|homeproxy|openclash)|luci-i18n-(passwall2?|homeproxy|openclash)-)' "$manifest"; then echo "ERROR: forbidden proxy plugin present in $device"; exit 1; fi
            cp "$manifest" "upload/${device}.manifest"
          done
          grep -q '2.6.4' package/fastacl252/Makefile
          grep -q 'nps.jontao.top' package/fastacl252/files/usr/libexec/nps-wan-mac
          cp .config upload/build.config
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.buildinfo' -exec cp -a {} upload/ \;
          cp "JuLiangTK-${DEVICE_GROUP}-final.config" profiles/fastacl-v252/README-2.6.4.md upload/
          printf 'branch=%s\ncommit=%s\nsource_commit=%s\nversion=2.6.4\ngroup=%s\ndevices=%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$SOURCE_COMMIT" "$DEVICE_GROUP" "$DEVICES" > upload/LITE-BUILD.txt
          sha256sum upload/* | tee upload/SHA256SUMS
          ls -lh upload
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: JuLiangTK-${{ matrix.tag }}-FastACL2.6.4-MT7981-${{ env.BUILD_DATE }}
          path: upload/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FastACL264-MT7981-grouped-failure-${{ matrix.group }}-${{ github.run_id }}
          path: |
            logs/
            .config
            JuLiangTK-*-final.config
          if-no-files-found: ignore
          retention-days: 14
